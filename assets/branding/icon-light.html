<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head><body>

<style>
body{margin:0}
</style>

<div style="width: 512px; height: 512px; display: flex; align-items: center; justify-content: center">
<svg width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="FlatCraft app icon: a paper F popping out of its cut-out, the drag knife resting at the end of the cut">
<defs>
<clipPath id="c2-clip">
<rect x="50" y="50" width="412" height="412" rx="92"></rect>
</clipPath>

<path d="M150 150 L310 150 L310 202 L202 202 L202 244 L282 244 L282 292 L202 292 L202 380 L150 380 Z"></path>
</clipPath>
<pattern id="c2-grid" width="34.33" height="34.33" patternUnits="userSpaceOnUse" x="50" y="50">

<linearGradient id="c2-mat" x1="0" y1="0" x2="0" y2="1">

<feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"></feDropShadow>
</filter>

<feDropShadow dx="-8" dy="14" stdDeviation="8" flood-color="#2B2418" flood-opacity="0.32"></feDropShadow>
</filter>
<filter id="c2-inner" x="-0.2" y="-0.2" width="1.4" height="1.4">
<feGaussianBlur stdDeviation="4"></feGaussianBlur>
</filter>
<filter id="c2-blade" x="-0.5" y="-0.5" width="2" height="2">
<feDropShadow dx="-6" dy="10" stdDeviation="6" flood-color="#2B2418" flood-opacity="0.3"></feDropShadow>

</defs>
<g filter="url(#c2-shadow)">
<path fill-rule="evenodd" d="M142 50 L370 50 A92 92 0 0 1 462 142 L462 370 A92 92 0 0 1 370 462 L142 462 A92 92 0 0 1 50 370 L50 142 A92 92 0 0 1 142 50 Z M150 150 L150 380 L202 380 L202 292 L282 292 L282 244 L202 244 L202 202 L310 202 L310 150 Z" fill="url(#c2-paper)"></path>
</g>

<rect x="-17" y="-140" width="34" height="104" rx="10" fill="#EEE9DD"></rect>
<rect x="-17" y="-70" width="34" height="12" fill="#F2A33A"></rect>

</g>
<rect x="50.5" y="50.5" width="411" height="411" rx="91.5" fill="none" stroke="#000000" stroke-opacity="0.06"></rect>
