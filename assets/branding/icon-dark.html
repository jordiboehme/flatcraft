<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head><body>

<style>
body{margin:0}
</style>

<div style="width: 512px; height: 512px; display: flex; align-items: center; justify-content: center">
<svg width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="FlatCraft app icon: a paper letter F lifting off a teal cutting mat, the drag knife resting where the cut ended">
<defs>
<linearGradient id="ac-bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#16514D"></stop>
<stop offset="1" stop-color="#0B2928"></stop>
</linearGradient>
<pattern id="ac-minor" width="25.75" height="25.75" patternUnits="userSpaceOnUse" x="50" y="50">
<path d="M25.75 0 L0 0 0 25.75" fill="none" stroke="#7FE0D2" stroke-opacity="0.13" stroke-width="1"></path>
</pattern>
<pattern id="ac-major" width="103" height="103" patternUnits="userSpaceOnUse" x="50" y="50">
<path d="M103 0 L0 0 0 103" fill="none" stroke="#7FE0D2" stroke-opacity="0.28" stroke-width="1.5"></path>
</pattern>
<clipPath id="ac-clip">
<rect x="50" y="50" width="412" height="412" rx="92"></rect>
</clipPath>
<linearGradient id="ac-paper" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FFFDF7"></stop>
<stop offset="1" stop-color="#EDE4D0"></stop>
</linearGradient>
<filter id="ac-shadow" x="-0.3" y="-0.3" width="1.6" height="1.6">
<feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"></feDropShadow>
</filter>
<filter id="ac-lift" x="-0.4" y="-0.4" width="1.8" height="1.8">
<feDropShadow dx="-12" dy="20" stdDeviation="10" flood-color="#021413" flood-opacity="0.55"></feDropShadow>
</filter>
</defs>
<g filter="url(#ac-shadow)">
<rect x="50" y="50" width="412" height="412" rx="92" fill="url(#ac-bg)"></rect>
</g>
<g clip-path="url(#ac-clip)">
<rect x="50" y="50" width="412" height="412" fill="url(#ac-minor)"></rect>
<rect x="50" y="50" width="412" height="412" fill="url(#ac-major)"></rect>
</g>
<rect x="50.5" y="50.5" width="411" height="411" rx="91.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"></rect>
<path d="M175 390 L175 130 L345 130 L345 186 L231 186 L231 236 L315 236 L315 288 L231 288 L231 390 Z" fill="none" stroke="#F2A33A" stroke-opacity="0.55" stroke-width="4" stroke-dasharray="9 8"></path>
<g transform="translate(34 -30) rotate(-8 260 260)" filter="url(#ac-lift)">
<path d="M175 390 L175 130 L345 130 L345 186 L231 186 L231 236 L315 236 L315 288 L231 288 L231 390 Z" fill="url(#ac-paper)"></path>
<path d="M175 390 L175 130 L345 130 L345 186 L231 186 L231 236 L315 236 L315 288 L231 288 L231 390 Z" fill="none" stroke="#F2A33A" stroke-width="4" stroke-linejoin="miter"></path>
</g>
<g transform="translate(175 390) rotate(-32)">
<polygon points="0,0 -7,-20 7,-20" fill="#DDE3E2"></polygon>
<rect x="-13" y="-38" width="26" height="19" rx="3" fill="#2A3433"></rect>
<rect x="-17" y="-140" width="34" height="104" rx="10" fill="#EEE9DD"></rect>
<rect x="-17" y="-70" width="34" height="12" fill="#F2A33A"></rect>
<rect x="5" y="-132" width="6" height="56" rx="3" fill="#FFFFFF" fill-opacity="0.55"></rect>
</g>
</svg>
</div>
</body></html>
