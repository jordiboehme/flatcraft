[workspace]
resolver = "3"
members = [
    "crates/flatcraft-core",
    "crates/flatcraft-import",
    "crates/flatcraft-path",
    "crates/flatcraft-device",
    "crates/flatcraft-engine",
    "crates/flatcraft-mcp",
    "crates/flatcraft",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/jordiboehme/flatcraft"
rust-version = "1.99.0"

[workspace.dependencies]
kurbo = "=0.13.1"
serde = "=1.0.229"
serde_json = "=1.0.154"
base64 = "=0.23.1"
thiserror = "=2.0.21"
usvg = "=0.50.0"
resvg = "=0.50.0"
tiny-skia = "=0.12.0"
image = { version = "=0.25.10", default-features = false }
visioncortex = "=0.9.3"
toml = "=1.2.2"
directories = "=6.0.0"
schemars = "=1.2.3"
rmcp = { version = "=3.11.0", default-features = false }
tokio = "=1.54.1"
anyhow = "=1.0.105"
eframe = { version = "=0.37.0", default-features = false }
egui = { version = "=0.37.0", default-features = false }
egui_kittest = "=0.37.0"
rfd = "=0.18.0"
clap = "=4.6.9"
muda = "=0.21.2"
proptest = "=1.12.0"
insta = "=1.49.0"
tempfile = "=3.27.0"
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
codegen-units = 1
