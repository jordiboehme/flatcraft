# Starting values in our own words, from several public sources (see
# docs/materials.md). Always check them with a test cut first.
id = "magnet-sheet"
name = "Printable magnet sheet (thin)"
group = "other"
speed = 1
force = 24
passes = 1
reverse_alternate_passes = false
overcut_mm = 0.5
track_enhancing = false
# Thick or dense: the blade turns badly while it is down, so it cuts
# 0.1 mm past sharp corners in the waste, lifts and starts the next line
# fresh (docs/materials.md, corner mode).
corner_mode = { LiftOvershoot = { overshoot_mm = 0.1 } }
# No backing sheet: small loose parts fall out.
backing = false
mat_tack = "strong"
blade_depth_hint = "blade 4"
tips = "Only for thin sheets, about 0.3 mm. Printed side up. If a piece does not come free, add a second pass rather than more force."
