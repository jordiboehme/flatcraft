# Starting values in our own words, from several public sources (see
# docs/materials.md). Always check them with a test cut first.
id = "vinyl"
name = "Adhesive vinyl (permanent)"
group = "vinyl"
speed = 5
force = 8
passes = 1
reverse_alternate_passes = false
overcut_mm = 0.5
track_enhancing = false
backing = true
mat_tack = "standard"
blade_depth_hint = "blade 1"
tips = "Put it on the mat with the coloured side up and the paper backing down. Weed soon after the cut, while the lines are fresh, and lift the design with transfer tape."
