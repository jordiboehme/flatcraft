# Starting values in our own words, from several public sources (see
# docs/materials.md). Always check them with a test cut first.
id = "heat-transfer-vinyl-flock"
name = "Heat transfer vinyl (flock)"
group = "iron_on"
speed = 4
force = 14
passes = 1
reverse_alternate_passes = false
overcut_mm = 0.5
track_enhancing = false
backing = true
mat_tack = "standard"
blade_depth_hint = "blade 2"
tips = "Mirror the design and cut with the shiny carrier side down. These values are the least sure of all, they vary a lot: do a test cut first and expect to raise the force a little. Weed in good light, the fuzzy top hides the cut lines."
