# Starting values in our own words, from several public sources (see
# docs/materials.md). Always check them with a test cut first.
id = "heat-transfer-vinyl-glitter"
name = "Heat transfer vinyl (glitter)"
group = "iron_on"
speed = 4
force = 18
passes = 1
reverse_alternate_passes = false
overcut_mm = 0.5
track_enhancing = false
backing = true
mat_tack = "standard"
blade_depth_hint = "blade 3"
tips = "Mirror the design and cut with the shiny carrier side down. These values are the least sure of all, they vary a lot: do a test cut first and expect to raise the force a little. Keep details bigger than about 2 mm and weed slowly."
