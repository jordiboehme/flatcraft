# Starting values in our own words, from several public sources (see
# docs/materials.md). Always check them with a test cut first.
id = "copy-paper"
name = "Copy paper"
group = "paper_and_card"
speed = 5
force = 10
passes = 1
reverse_alternate_passes = false
overcut_mm = 0.5
track_enhancing = false
corner_mode = "Arc"
# No backing sheet: small loose parts fall out.
backing = false
mat_tack = "light"
blade_depth_hint = "blade 2"
tips = "Smooth the sheet flat on the mat. To take it off, turn the mat over and peel the mat away from the paper, so the paper does not curl."
