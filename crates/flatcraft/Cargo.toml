[package]
name = "flatcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
flatcraft-engine = { path = "../flatcraft-engine" }
flatcraft-device = { path = "../flatcraft-device" }
flatcraft-mcp = { path = "../flatcraft-mcp" }
flatcraft-core = { path = "../flatcraft-core" }
flatcraft-import = { path = "../flatcraft-import" }
flatcraft-path = { path = "../flatcraft-path" }
flatcraft-sim = { path = "../flatcraft-sim" }
kurbo.workspace = true
eframe = { workspace = true, features = ["glow", "accesskit", "links", "x11", "wayland"] }
egui.workspace = true
resvg.workspace = true
usvg.workspace = true
tiny-skia.workspace = true
rfd.workspace = true
clap = { workspace = true, features = ["derive"] }
anyhow.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "NSWorkspace", "NSAccessibility"] }

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true
toml.workspace = true
